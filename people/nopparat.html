<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Travel Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    color: #222;
}

/* HEADER */

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    margin: 0;
}

/* GAME */

.game {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* STATUS */

.status {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.box {
    background: white;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
}

.box h3 {
    margin: 5px;
}

/* WORLD */

.world {
    background: #dff6ff;
    padding: 25px;
    border-radius: 20px;
}

.world h2 {
    text-align: center;
}

/* COUNTRY GRID */

.countries {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.country {
    background: white;
    border: none;
    border-radius: 15px;
    padding: 25px 10px;
    cursor: pointer;
    font-size: 20px;
    transition: .2s;
    box-shadow: 0 5px 12px rgba(0,0,0,.15);
}

.country:hover {
    transform: translateY(-5px) scale(1.03);
    background: #f0f9ff;
}

/* TOURIST */

.tourist {
    display: none;
    background: white;
    padding: 25px;
    border-radius: 20px;
}

.tourist h2 {
    text-align: center;
}

.places {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.place {
    background: #f8fafc;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

.place .image {
    height: 150px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 70px;
    background: #dbeafe;
}

.place-info {
    padding: 15px;
}

.place h3 {
    margin-top: 0;
}

.visit {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.visit:hover {
    background: #1d4ed8;
}

.visited {
    background: #16a34a !important;
}

/* BACK */

.back {
    margin-bottom: 15px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

/* MESSAGE */

.log {
    background: white;
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
}

#message {
    font-size: 18px;
    font-weight: bold;
}

/* MOBILE */

@media(max-width: 700px) {

    .status {
        grid-template-columns: repeat(2, 1fr);
    }

    .countries {
        grid-template-columns: repeat(2, 1fr);
    }

    .places {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

/* =========================
   VARIABLES
========================= */

let money = 10000;

let score = 0;

let currentCountry = "ไทย";

let visitedCountries = ["ไทย"];

let visitedPlaces = [];


/* =========================
   OPEN COUNTRY
========================= */

function openCountry(country) {

    currentCountry = country;

    document.getElementById("worldPage").style.display = "none";

    document.getElementById("touristPage").style.display = "block";

    document.getElementById("countryTitle").innerText =
        "🌍 สถานที่ท่องเที่ยวใน " + country;

    let placesHTML = "";

    data[country].forEach((place, index) => {

        let placeID = country + "-" + index;

        let alreadyVisited =
            visitedPlaces.includes(placeID);

        placesHTML += `

        <div class="place">

            <div class="image">
                ${place.icon}
            </div>

            <div class="place-info">

                <h3>${place.name}</h3>

                <p>${place.description}</p>

                <p>💰 ค่าเที่ยว:
                ${place.cost.toLocaleString()} บาท</p>

                <p>⭐ รางวัล:
                +${place.reward} คะแนน</p>

                <button
                    class="visit ${alreadyVisited ? 'visited' : ''}"
                    onclick="visitPlace('${country}', ${index})"
                    ${alreadyVisited ? 'disabled' : ''}
                >

                ${alreadyVisited
                    ? "✅ เที่ยวแล้ว"
                    : "✈️ ไปเที่ยว"}

                </button>

            </div>

        </div>

        `;

    });

    document.getElementById("places").innerHTML =
        placesHTML;
}


/* =========================
   VISIT PLACE
========================= */

function visitPlace(country, index) {

    let place = data[country][index];

    let placeID = country + "-" + index;

    if (visitedPlaces.includes(placeID)) {

        showMessage("คุณเคยเที่ยวสถานที่นี้แล้ว");

        return;
    }

    if (money < place.cost) {

        showMessage(
            "❌ เงินไม่พอ! ต้องใช้ " +
            place.cost.toLocaleString() +
            " บาท"
        );

        return;
    }

    money -= place.cost;

    score += place.reward;

    visitedPlaces.push(placeID);

    if (!visitedCountries.includes(country)) {

        visitedCountries.push(country);

    }

    showMessage(
        "🎉 เที่ยว " +
        place.name +
        " สำเร็จ! +" +
        place.reward +
        " คะแนน"
    );

    updateGame();

    openCountry(country);

    checkWin();
}


/* =========================
   BACK
========================= */

function backToWorld() {

    document.getElementById("touristPage").style.display =
        "none";

    document.getElementById("worldPage").style.display =
        "block";
}


/* =========================
   UPDATE
========================= */

function updateGame() {

    document.getElementById("money").innerText =
        money.toLocaleString();

    document.getElementById("score").innerText =
        score;

    document.getElementById("countryCount").innerText =
        visitedCountries.length;

    let flags = {

        "ไทย":"🇹🇭",
        "ญี่ปุ่น":"🇯🇵",
        "เกาหลีใต้":"🇰🇷",
        "จีน":"🇨🇳",
        "ฝรั่งเศส":"🇫🇷",
        "อังกฤษ":"🇬🇧",
        "อิตาลี":"🇮🇹",
        "เยอรมนี":"🇩🇪",
        "สหรัฐอเมริกา":"🇺🇸",
        "แคนาดา":"🇨🇦",
        "บราซิล":"🇧🇷",
        "ออสเตรเลีย":"🇦🇺"

    };

    document.getElementById("current").innerText =
        flags[currentCountry] +
        " " +
        currentCountry;
}


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

    document.getElementById("message").innerText =
        text;
}


/* =========================
   WIN
========================= */

function checkWin() {

    if (visitedPlaces.length >= 36) {

        showMessage(
            "🏆 สุดยอด! คุณเที่ยวครบทุกสถานที่ทั่วโลกแล้ว! 🌍🎉"
        );

    }

}


/* =========================
   START
========================= */

updateGame();
