<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>นายเมฆา สีม่วงคำ | Mechatronics Engineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #150f1a;
      --card-bg: rgba(35, 23, 43, 0.75);
      --accent: #f5b544;
      --accent-glow: rgba(245, 181, 68, 0.3);
      --accent-2: #c9679a;
      --text: #fdf6ec;
      --text-muted: #b6a8be;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 15% 20%, #3a1f4d 0%, transparent 45%),
                  radial-gradient(circle at 85% 80%, #4a2036 0%, transparent 45%),
                  var(--bg);
      font-family: 'Sarabun', 'Space Grotesk', sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      display: grid;
      grid-template-columns: 200px 1fr;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  0 0 40px var(--accent-glow);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  0 0 50px rgba(56, 189, 248, 0.5);
    }

    .side {
      background: linear-gradient(160deg, rgba(245, 181, 68, 0.14), rgba(201, 103, 154, 0.1));
      border-right: 1px solid var(--border);
      padding: 40px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
    }

    .monogram {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #201421;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
    }

    .side .badge { margin: 20px 0 0; }

    .side .course {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .main {
      padding: 40px 36px;
    }

    .content {
      display: flex;
      flex-direction: column;
    }

    .badge {
      display: inline-block;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
    }

    .name {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .role {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 24px 0;
    }

    .tags-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
      transition: all 0.2s ease;
    }

    .tag:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: #fff;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border);
      padding: 12px 24px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b0f19;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    @media (max-width: 560px) {
      .card { grid-template-columns: 1fr; }
      .side {
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 24px 28px;
      }
      .side .course { display: none; }
      .main { padding: 32px 28px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="side">
      <div class="monogram">มค</div>
      <span class="badge">ENGMC613 2569</span>
      <p class="course">คณะวิศวกรรมศาสตร์<br>สาขาเมคคาทรอนิกส์</p>
    </div>

    <div class="main">
      <div class="content">
        <h1 class="name">นายเมฆา สีม่วงคำ</h1>
        <p class="role">นักศึกษาสาขาวิศวกรรมเมคคาทรอนิกส์</p>

        <div class="divider"></div>

        <div class="tags-label">Areas of Interest</div>
        <div class="tags">
          <span class="tag">PLC & Automation</span>
          <span class="tag">CAD / 3D Design</span>
          <span class="tag">Robotics</span>
          <span class="tag">Git & Version Control</span>
        </div>

        <div>
          <a href="../index.html" class="back-btn">
            <span>←</span> ย้อนกลับหน้าทำเนียบนักศึกษา
          </a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
