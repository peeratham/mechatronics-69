<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mechatronics Engineering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, "Noto Sans Thai", sans-serif;

            background:
                radial-gradient(circle at 70% 40%,
                rgba(0, 210, 255, 0.08),
                transparent 30%),
                #07111d;

            color: white;
            overflow: hidden;
        }

        /* ---------------- MAIN ---------------- */

        .container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .content {
            text-align: center;
            z-index: 5;
        }

        /* ---------------- TOP TEXT ---------------- */

        .major {
            color: #38d9f5;
            font-size: 15px;
            letter-spacing: 6px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* ---------------- NAME ---------------- */

        h1 {
            font-size: clamp(50px, 8vw, 95px);
            font-weight: 800;
            letter-spacing: 2px;

            color: #f4f9fc;

            text-shadow:
                0 0 25px rgba(60, 220, 255, 0.12);
        }

        h1 span {
            color: #39d9f5;
        }

        /* เส้นใต้ชื่อ */

        .line {
            width: 90px;
            height: 4px;

            background: #39d9f5;

            margin: 25px auto;

            border-radius: 10px;

            box-shadow:
                0 0 15px rgba(57, 217, 245, 0.6);
        }

        /* ---------------- DESCRIPTION ---------------- */

        .description {
            color: #8193a5;
            font-size: 14px;

            letter-spacing: 4px;
        }

        /* ---------------- GEAR ---------------- */

        .gear {
            position: absolute;

            color: #243747;

            font-size: 180px;

            opacity: 0.45;

            z-index: 1;

            animation: rotateGear 18s linear infinite;
        }

        .gear.small {
            font-size: 90px;

            color: #1b3443;

            opacity: 0.7;

            animation:
                rotateGearReverse 12s linear infinite;
        }

        /* ตำแหน่งฟันเฟือง */

        .gear1 {
            top: 8%;
            left: 8%;
        }

        .gear2 {
            bottom: 7%;
            right: 10%;
        }

        .gear3 {
            top: 12%;
            right: 13%;
        }

        .gear4 {
            bottom: 15%;
            left: 15%;
        }

        /* ---------------- ANIMATION ---------------- */

        @keyframes rotateGear {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes rotateGearReverse {

            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }

        }

        /* ---------------- CIRCUIT LINE ---------------- */

        .circuit {
            position: absolute;

            width: 180px;
            height: 180px;

            border: 1px solid rgba(57, 217, 245, 0.12);

            border-radius: 20px;

            transform: rotate(45deg);

            z-index: 0;
        }

        .circuit::before {
            content: "";

            position: absolute;

            width: 60px;
            height: 1px;

            background: #39d9f5;

            top: 50%;
            left: -60px;

            opacity: 0.3;
        }

        .circuit::after {
            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #39d9f5;

            top: 50%;
            right: -4px;

            box-shadow:
                0 0 12px #39d9f5;
        }

        .circuit1 {
            top: 18%;
            left: 28%;
        }

        .circuit2 {
            bottom: 20%;
            right: 28%;
        }

        /* ---------------- BOTTOM ---------------- */

        .bottom {
            margin-top: 35px;

            display: flex;
            justify-content: center;
            gap: 12px;

            color: #627789;

            font-size: 11px;
            letter-spacing: 2px;
        }

        .bottom span {
            color: #39d9f5;
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 600px) {

            .major {
                font-size: 11px;
                letter-spacing: 3px;
            }

            h1 {
                font-size: 42px;
            }

            .description {
                font-size: 10px;
                letter-spacing: 2px;
            }

            .gear {
                font-size: 100px;
            }

            .gear.small {
                font-size: 60px;
            }

            .circuit {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ฟันเฟืองด้านหลัง -->

        <div class="gear gear1">⚙</div>

        <div class="gear small gear2">⚙</div>

        <div class="gear small gear3">⚙</div>

        <div class="gear gear4">⚙</div>


        <!-- เส้นวงจร -->

        <div class="circuit circuit1"></div>

        <div class="circuit circuit2"></div>


        <!-- เนื้อหาหลัก -->

        <div class="content">

            <div class="major">
                MECHATRONICS ENGINEERING
            </div>

            <h1>
                นารีลักษณ์ <span>ยะวรรณ์</span>
            </h1>

            <div class="line"></div>

            <div class="description">
                MECHANICAL • ELECTRONICS • CONTROL • AUTOMATION
            </div>

            <div class="bottom">
                <span>⚙</span>
                ENGINEERING
                <span>•</span>
                INNOVATION
                <span>•</span>
                TECHNOLOGY
            </div>

        </div>

    </div>

</body>
</html>
