<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เจน x แมวเปียโน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600&family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --ink:#201F1C;
    --grey:#726E64;
    --line:#DBD7CB;
    --gold:#B8791F;
    --gold-soft:#E4C88C;
    --white-fur:#FFFFFF;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Mitr', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(28px, 6vw, 56px) 20px 48px;
    max-width:560px;
    margin:0 auto;
  }

  /* --- ambient floating notes --- */
  .notes-bg{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .notes-bg span{
    position:absolute;
    font-size:22px;
    color:var(--line);
    opacity:.9;
    animation:drift 14s linear infinite;
  }
  .notes-bg span:nth-child(1){ left:8%;  top:100%; animation-delay:0s;   font-size:26px;}
  .notes-bg span:nth-child(2){ left:80%; top:100%; animation-delay:4s;   font-size:18px;}
  .notes-bg span:nth-child(3){ left:45%; top:100%; animation-delay:8s;   font-size:22px;}
  .notes-bg span:nth-child(4){ left:65%; top:100%; animation-delay:11s;  font-size:16px;}

  @keyframes drift{
    0%   { transform:translateY(0) rotate(0deg);   opacity:0; }
    10%  { opacity:.9; }
    90%  { opacity:.3; }
    100% { transform:translateY(-120vh) rotate(18deg); opacity:0; }
  }

  header{
    position:relative;
    z-index:1;
    text-align:center;
    margin-bottom:6px;
  }

  .name{
    font-family:'Taviraj', serif;
    font-weight:600;
    font-size:clamp(48px, 13vw, 72px);
    line-height:1;
    margin:0;
    color:var(--ink);
  }

  .name span{
    color:var(--gold);
  }

  .fullname{
    font-family:'Mitr', sans-serif;
    font-weight:300;
    font-size:15px;
    letter-spacing:.03em;
    color:var(--grey);
    margin:10px 0 0;
  }

  .tagline{
    font-family:'Mitr', sans-serif;
    font-weight:300;
    font-size:14px;
    color:var(--grey);
    margin:18px 0 0;
    max-width:280px;
    line-height:1.7;
  }

  /* --- divider --- */
  .divider{
    position:relative;
    width:180px;
    height:1px;
    background:var(--line);
    margin:28px 0;
  }
  .divider::after{
    content:"🐾";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:var(--paper);
    padding:0 10px;
    font-size:13px;
  }

  /* --- cat stage --- */
  .cat-stage{
    position:relative;
    z-index:1;
    width:100%;
    display:flex;
    justify-content:center;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  #catSvg{
    width:min(78vw, 300px);
    height:auto;
    cursor:pointer;
    overflow:visible;
  }

  .tail-group{
    transform-origin:118px 168px;
    animation:tailsway 3.6s ease-in-out infinite;
  }
  .tail-group.fast{
    animation:tailwag .35s ease-in-out infinite;
  }
  @keyframes tailsway{
    0%,100%{ transform:rotate(-6deg); }
    50%{ transform:rotate(9deg); }
  }
  @keyframes tailwag{
    0%,100%{ transform:rotate(-16deg); }
    50%{ transform:rotate(16deg); }
  }

  .eyes-normal .pupil{
    transform-origin:center;
    animation:blink 5.2s ease-in-out infinite;
  }
  .eyes-normal .pupil.right{ animation-delay:.05s; }
  @keyframes blink{
    0%, 94%, 100% { transform:scaleY(1); }
    96%           { transform:scaleY(0.08); }
  }

  .eyes-happy{ opacity:0; transition:opacity .15s ease; }
  .cat.happy .eyes-normal{ opacity:0; }
  .cat.happy .eyes-happy{ opacity:1; }

  .ear{
    transform-origin:center bottom;
  }
  .ear.wiggle-l{ animation:wiggleL .5s ease; }
  .ear.wiggle-r{ animation:wiggleR .5s ease; }
  @keyframes wiggleL{
    0%,100%{ transform:rotate(0deg); }
    30%{ transform:rotate(-14deg); }
    60%{ transform:rotate(8deg); }
  }
  @keyframes wiggleR{
    0%,100%{ transform:rotate(0deg); }
    30%{ transform:rotate(14deg); }
    60%{ transform:rotate(-8deg); }
  }

  .pops{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .pop{
    position:absolute;
    font-size:20px;
    animation:popfloat 1s ease-out forwards;
  }
  @keyframes popfloat{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    15%{ opacity:1; transform:translateY(-6px) scale(1); }
    100%{ transform:translateY(-70px) scale(1); opacity:0; }
  }

  .hint{
    font-size:13px;
    color:var(--grey);
    font-weight:300;
    margin:16px 0 0;
    text-align:center;
  }

  /* --- piano --- */
  .piano-wrap{
    position:relative;
    z-index:1;
    margin-top:8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }

  .piano{
    position:relative;
    display:flex;
    width:min(100%, 420px);
    height:150px;
    background:var(--ink);
    padding:8px 8px 10px;
    border-radius:6px;
    box-shadow:0 10px 24px rgba(32,31,28,.18);
  }

  .white-key{
    position:relative;
    flex:1;
    background:var(--white-fur);
    border:1px solid var(--line);
    border-radius:0 0 5px 5px;
    margin:0 1px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:8px;
    font-size:10px;
    color:var(--grey);
    font-family:'Mitr', sans-serif;
    transition:background .08s ease;
  }
  .white-key.active{
    background:var(--gold-soft);
  }

  .black-key{
    position:absolute;
    top:8px;
    width:9.5%;
    height:62%;
    background:var(--ink);
    border:1px solid #000;
    border-radius:0 0 4px 4px;
    z-index:2;
    transition:background .08s ease;
  }
  .black-key.active{
    background:var(--gold);
  }

  footer{
    position:relative;
    z-index:1;
    margin-top:32px;
    font-size:12px;
    color:var(--line);
    font-weight:300;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .tail-group, .notes-bg span, .eyes-normal .pupil{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="notes-bg">
    <span>♪</span><span>♫</span><span>♩</span><span>♪</span>
  </div>

  <header>
    <h1 class="name">เจน<span>.</span></h1>
    <p class="fullname">ศักดิ์สกุล อนุภาพ</p>
    <p class="tagline">แมวขาวดำตัวนี้ชอบสองอย่างที่สุด คือให้คนมาเล่นด้วย กับเสียงเปียโนเพราะๆ</p>
  </header>

  <div class="divider"></div>

  <div class="cat-stage" id="catStage">
    <svg id="catSvg" viewBox="0 0 220 210" class="cat">

      <!-- tail -->
      <g class="tail-group" id="tail">
        <path d="M118 168 C 150 178, 168 150, 150 128 C 138 113, 150 100, 168 104"
              fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>
      </g>

      <!-- body -->
      <ellipse cx="110" cy="168" rx="52" ry="34" fill="var(--ink)"/>
      <ellipse cx="118" cy="182" rx="30" ry="18" fill="var(--white-fur)"/>
      <ellipse cx="86"  cy="196" rx="10" ry="7" fill="var(--white-fur)"/>
      <ellipse cx="140" cy="196" rx="10" ry="7" fill="var(--white-fur)"/>

      <!-- collar -->
      <path d="M84 148 Q110 160 138 148" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="111" cy="160" r="5" fill="var(--gold)"/>

      <!-- head -->
      <defs>
        <clipPath id="headClip">
          <circle cx="110" cy="96" r="52"/>
        </clipPath>
      </defs>

      <!-- ears -->
      <g class="ear ear-l" id="earL">
        <path d="M68 66 L58 24 L96 54 Z" fill="var(--ink)"/>
        <path d="M74 58 L69 36 L88 52 Z" fill="var(--gold-soft)"/>
      </g>
      <g class="ear ear-r" id="earR">
        <path d="M152 66 L162 24 L124 54 Z" fill="var(--ink)"/>
        <path d="M146 58 L151 36 L132 52 Z" fill="var(--gold-soft)"/>
      </g>

      <circle cx="110" cy="96" r="52" fill="var(--white-fur)"/>
      <g clip-path="url(#headClip)">
        <ellipse cx="146" cy="80" rx="42" ry="50" fill="var(--ink)"/>
      </g>

      <!-- eyes: normal -->
      <g class="eyes-normal">
        <g>
          <ellipse cx="90" cy="98" rx="9" ry="11" fill="var(--gold)"/>
          <ellipse class="pupil left" cx="90" cy="99" rx="3.4" ry="7" fill="var(--ink)"/>
        </g>
        <g>
          <ellipse cx="130" cy="98" rx="9" ry="11" fill="var(--gold)"/>
          <ellipse class="pupil right" cx="130" cy="99" rx="3.4" ry="7" fill="var(--ink)"/>
        </g>
      </g>

      <!-- eyes: happy (^ ^) -->
      <g class="eyes-happy">
        <path d="M80 100 Q90 88 100 100" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
        <path d="M120 100 Q130 88 140 100" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- nose + mouth -->
      <path d="M104 116 L116 116 L110 124 Z" fill="var(--gold)"/>
      <path d="M110 124 L110 129" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M110 129 Q101 137 92 130" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M110 129 Q119 137 128 130" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- whiskers -->
      <g stroke="var(--grey)" stroke-width="1.6" stroke-linecap="round">
        <path d="M78 112 L46 106"/>
        <path d="M78 120 L44 122"/>
        <path d="M142 112 L174 106"/>
        <path d="M142 120 L176 122"/>
      </g>
    </svg>

    <div class="pops" id="pops"></div>
  </div>

  <p class="hint">แตะที่แมวเพื่อเล่นด้วยกัน 🐾</p>

  <div class="divider"></div>

  <div class="piano-wrap">
    <div class="piano" id="piano"></div>
    <p class="hint">กดคีย์เปียโนเพื่อฟังเสียง 🎹</p>
  </div>

  <footer>ทำด้วยความยินดีสำหรับเจน</footer>
</div>

<script>
(function(){
  // ---------- audio ----------
  let ctx;
  function getCtx(){
    if(!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(ctx.state === 'suspended'){ ctx.resume(); }
    return ctx;
  }

  function playTone(freq, duration){
    const c = getCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, c.currentTime);
    gain.gain.setValueAtTime(0.0001, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.28, c.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start();
    osc.stop(c.currentTime + duration + 0.05);
  }

  function playMeow(){
    const c = getCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(720, c.currentTime);
    osc.frequency.exponentialRampToValueAtTime(340, c.currentTime + 0.28);
    gain.gain.setValueAtTime(0.0001, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, c.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.34);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start();
    osc.stop(c.currentTime + 0.4);
  }

  // ---------- cat interaction ----------
  const cat = document.getElementById('catSvg');
  const tail = document.getElementById('tail');
  const earL = document.getElementById('earL');
  const earR = document.getElementById('earR');
  const pops = document.getElementById('pops');
  const popIcons = ['🐾','💛','✨'];

  cat.addEventListener('click', function(){
    playMeow();
    cat.classList.add('happy');
    tail.classList.add('fast');
    earL.classList.add('wiggle-l');
    earR.classList.add('wiggle-r');

    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.textContent = popIcons[Math.floor(Math.random()*popIcons.length)];
    pop.style.left = (35 + Math.random()*30) + '%';
    pop.style.top = (25 + Math.random()*20) + '%';
    pops.appendChild(pop);
    setTimeout(()=> pop.remove(), 1000);

    setTimeout(()=>{
      cat.classList.remove('happy');
      tail.classList.remove('fast');
      earL.classList.remove('wiggle-l');
      earR.classList.remove('wiggle-r');
    }, 550);
  });

  // ---------- piano ----------
  const notes = [
    { note:'C',  freq:261.63, type:'white' },
    { note:'C#', freq:277.18, type:'black' },
    { note:'D',  freq:293.66, type:'white' },
    { note:'D#', freq:311.13, type:'black' },
    { note:'E',  freq:329.63, type:'white' },
    { note:'F',  freq:349.23, type:'white' },
    { note:'F#', freq:369.99, type:'black' },
    { note:'G',  freq:392.00, type:'white' },
    { note:'G#', freq:415.30, type:'black' },
    { note:'A',  freq:440.00, type:'white' },
    { note:'A#', freq:466.16, type:'black' },
    { note:'B',  freq:493.88, type:'white' },
    { note:'C',  freq:523.25, type:'white' }
  ];

  const piano = document.getElementById('piano');
  const whiteKeys = notes.filter(n => n.type === 'white');
  const whiteCount = whiteKeys.length;

  whiteKeys.forEach((n) => {
    const key = document.createElement('div');
    key.className = 'white-key';
    key.dataset.freq = n.freq;
    piano.appendChild(key);
  });

  // black key horizontal positions, expressed as fraction of white-key index
  const blackOffsets = [0.62, 1.62, 3.55, 4.55, 5.55]; // between C-D, D-E, F-G, G-A, A-B
  const blackNotes = notes.filter(n => n.type === 'black');
  const whiteKeyWidthPct = 100 / whiteCount;

  blackNotes.forEach((n, i) => {
    const key = document.createElement('div');
    key.className = 'black-key';
    key.dataset.freq = n.freq;
    key.style.left = (blackOffsets[i] * whiteKeyWidthPct) + '%';
    piano.appendChild(key);
  });

  function pressKey(el){
    const freq = parseFloat(el.dataset.freq);
    playTone(freq, 0.5);
    el.classList.add('active');
    setTimeout(()=> el.classList.remove('active'), 160);
  }

  piano.addEventListener('pointerdown', function(e){
    const key = e.target.closest('.white-key, .black-key');
    if(key) pressKey(key);
  });

})();
</script>

</body>
</html>
