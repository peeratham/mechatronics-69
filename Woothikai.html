<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woothikai Romphanatham</title>
  
  <!-- นำเข้าฟอนต์ Prompt และไอคอน Font Awesome -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    /* ตั้งค่าพื้นหลังสไตล์ Dark Mode แมตช์กับ GitHub */
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #0d1117, #161b22);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* การ์ดโปรไฟล์โปร่งแสงสไตล์โมเดิร์นกึ่งมืด */
    .profile-card {
      background: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(12px);
      padding: 3rem 4rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 450px;
      width: 80%;
      border: 1px solid rgba(240, 246, 252, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    /* ตัวอักษรสีขาวสว่างอ่านง่าย */
    h1 {
      color: #f0f6fc;
      font-size: 2.2rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      letter-spacing: 0.5px;
    }

    p {
      color: #8b949e;
      font-size: 1.1rem;
      font-weight: 300;
      margin: 0 0 2rem 0;
    }

    /* เส้นใต้สีฟ้า Cyan ไฮไลต์ตัดกับโทนเข้ม */
    .divider {
      width: 50px;
      height: 4px;
      background: #58a6ff;
      margin: 1.5rem auto;
      border-radius: 2px;
    }

    /* ปุ่ม GitHub สไตล์พรีเมียมพร้อมไอคอน */
    .github-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px; /* เว้นระยะห่างระหว่างโลโก้กับข้อความ */
      background-color: #21262d;
      color: #c9d1d9;
      text-decoration: none;
      padding: 0.8rem 2rem;
      border-radius: 30px;
      font-weight: 400;
      font-size: 1rem;
      border: 1px solid rgba(240, 246, 252, 0.2);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* เอฟเฟกต์เรืองแสงเมื่อชี้ปุ่ม */
    .github-btn:hover {
      background-color: #30363d;
      color: #ffffff;
      border-color: #8b949e;
      transform: scale(1.05);
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 2.5rem 1.5rem;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <h1>Woothikai Romphanatham</h1>
    <div class="divider"></div>
    <p>Welcome to my official space.</p>
    
    <!-- ปุ่มลิงก์เชื่อมต่อไปยัง GitHub ของคุณโดยตรง -->
    <a href="https://github.com" target="_blank" class="github-btn">
      <i class="fab fa-github" style="font-size: 1.2rem;"></i> Visit My GitHub
    </a>
  </div>

</body>
</html>
