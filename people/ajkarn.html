<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08111f">
  <title>พีรธรรม เตชะพะโลกุล | ENGMC613</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #edf7ff; --muted: #9bb2c8; --cyan: #6ee7f9; --line: rgba(163, 210, 255, 0.16); --panel: rgba(12, 29, 49, 0.72); }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { min-height: 100vh; margin: 0; overflow-x: hidden; color: var(--ink); background: #08111f; font-family: "IBM Plex Sans Thai", sans-serif; }
    body::before, body::after { position: fixed; z-index: -2; content: ""; width: 38vw; height: 38vw; border-radius: 50%; filter: blur(12px); opacity: 0.48; pointer-events: none; }
    body::before { top: -15vw; right: -8vw; background: radial-gradient(circle, rgba(45, 193, 213, 0.48), transparent 68%); }
    body::after { bottom: -18vw; left: -12vw; background: radial-gradient(circle, rgba(76, 88, 218, 0.4), transparent 68%); }
    .grid { position: fixed; z-index: -1; inset: 0; opacity: 0.24; background-image: linear-gradient(rgba(133, 190, 227, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(133, 190, 227, 0.08) 1px, transparent 1px); background-size: 42px 42px; mask-image: linear-gradient(to bottom, black, transparent 80%); }
    .page { width: min(1080px, calc(100% - 40px)); min-height: 100vh; margin: auto; padding: 34px 0 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; animation: rise 0.8s ease both; }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--muted); font-family: "Space Grotesk", sans-serif; font-size: 0.76rem; letter-spacing: 0.18em; text-transform: uppercase; }
    .brand-mark { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid rgba(110, 231, 249, 0.45); color: var(--cyan); font-size: 0.9rem; transform: rotate(45deg); }
    .brand-mark span { transform: rotate(-45deg); }
    .back-link { color: var(--muted); font-size: 0.85rem; text-decoration: none; transition: color 0.25s ease, transform 0.25s ease; }
    .back-link:hover { color: var(--cyan); transform: translateX(-4px); }
    main { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 22px; align-items: stretch; padding-top: clamp(70px, 14vh, 150px); }
    .hero { animation: rise 0.9s 0.1s ease both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--cyan); font-family: "Space Grotesk", sans-serif; font-size: 0.76rem; letter-spacing: 0.15em; text-transform: uppercase; }
    .eyebrow::before { width: 34px; height: 1px; background: var(--cyan); content: ""; }
    h1 { max-width: 720px; margin: 20px 0 18px; font-size: clamp(2.7rem, 7vw, 5.8rem); font-weight: 600; letter-spacing: -0.04em; line-height: 1.05; }
    .intro { max-width: 540px; margin: 0; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.16rem); line-height: 1.9; }
    .profile-card { position: relative; display: flex; min-height: 330px; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 28px; border: 1px solid var(--line); border-radius: 4px; background: linear-gradient(145deg, rgba(24, 55, 80, 0.78), var(--panel)); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.26); animation: rise 0.9s 0.25s ease both; }
    .profile-card::before { position: absolute; top: -80px; right: -70px; width: 210px; height: 210px; border: 1px solid rgba(110, 231, 249, 0.35); border-radius: 50%; box-shadow: 0 0 0 20px rgba(110, 231, 249, 0.04), 0 0 0 40px rgba(110, 231, 249, 0.03); content: ""; }
    .card-label { color: var(--muted); font-family: "Space Grotesk", sans-serif; font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; }
    .avatar { display: grid; width: 92px; height: 92px; margin: 34px 0 22px; place-items: center; border: 1px solid rgba(110, 231, 249, 0.6); border-radius: 50%; color: var(--cyan); background: radial-gradient(circle at 35% 30%, rgba(110, 231, 249, 0.2), rgba(27, 51, 81, 0.5)); box-shadow: 0 0 0 8px rgba(110, 231, 249, 0.05), 0 0 36px rgba(110, 231, 249, 0.18); font-family: "Space Grotesk", sans-serif; font-size: 1.35rem; }
    .role { margin: 0; color: var(--ink); font-size: 1.2rem; font-weight: 500; }
    .meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 32px; padding-top: 17px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; }
    .meta strong { color: var(--cyan); font-weight: 500; }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: clamp(80px, 15vh, 150px); padding-top: 18px; border-top: 1px solid var(--line); color: #6d879e; font-family: "Space Grotesk", sans-serif; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; animation: rise 0.9s 0.4s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 720px) { .page { width: min(100% - 28px, 540px); padding-top: 22px; } main { grid-template-columns: 1fr; padding-top: 78px; } h1 { font-size: clamp(2.5rem, 13vw, 4.5rem); } .profile-card { min-height: 290px; } footer { margin-top: 80px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><span>+</span></span> ENGMC613 / 2569</div>
      <a class="back-link" href="../index.html">กลับหน้าหลัก &rarr;</a>
    </header>
    <main>
      <section class="hero">
        <div class="eyebrow">Course instructor</div>
        <h1>พีรธรรม<br>เตชะพะโลกุล</h1>
        <p class="intro">พื้นที่แนะนำบุคลากรประจำรายวิชา วิศวกรรมเมคคาทรอนิกส์และระบบอัจฉริยะ</p>
      </section>
      <aside class="profile-card">
        <div>
          <div class="card-label">Profile / 01</div>
          <div class="avatar" aria-hidden="true">พต</div>
          <p class="role">ผู้สอนประจำรายวิชา</p>
        </div>
        <div class="meta"><span>สถานะ</span><strong>ACTIVE</strong></div>
      </aside>
    </main>
    <footer><span>Mechatronics · 2026</span><span>Academic directory</span></footer>
  </div>
</body>
</html>
