```html
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>กิติพรรณ สุคำ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #080d18;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* แสงพื้นหลัง */
        body::before {
            content: "";
            position: absolute;

            width: 500px;
            height: 500px;

            background: #00d9ff;
            opacity: 0.15;
            filter: blur(150px);

            top: -150px;
            right: -100px;
        }

        body::after {
            content: "";
            position: absolute;

            width: 400px;
            height: 400px;

            background: #0066ff;
            opacity: 0.15;
            filter: blur(150px);

            bottom: -150px;
            left: -100px;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #00d9ff;
            letter-spacing: 5px;
            font-size: 18px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 75px;
            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #00d9ff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .line {
            width: 100px;
            height: 4px;
            background: #00d9ff;
            margin: 25px auto;
            border-radius: 10px;
        }

        .description {
            color: #9ca9bd;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .gear {
            position: absolute;
            font-size: 180px;
            opacity: 0.04;
            animation: rotate 15s linear infinite;
        }

        .gear1 {
            top: 10%;
            left: 10%;
        }

        .gear2 {
            bottom: 5%;
            right: 10%;
            animation-direction: reverse;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 45px;
            }

            .subtitle {
                font-size: 13px;
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="gear gear1">⚙</div>
    <div class="gear gear2">⚙</div>

    <div class="container">

        <div class="icon">⚙️</div>

        <div class="subtitle">
            MECHATRONICS ENGINEERING
        </div>

        <h1>
            กิติพรรณ สุคำ
        </h1>

        <div class="line"></div>

        <div class="description">
            MECHANICAL • ELECTRONICS • CONTROL • AUTOMATION
        </div>

    </div>

</body>
</html>
```
