<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mechatronics Engineering</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Noto Sans Thai", sans-serif;
            min-height: 100vh;
            background: #f5f9fc;
            color: #243447;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* กล่องหลัก */
        .hero {
            width: 90%;
            max-width: 1100px;
            min-height: 600px;
            background: white;
            border-radius: 35px;
            position: relative;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            box-shadow: 0 20px 50px rgba(50, 100, 130, 0.12);
        }

        /* วงกลมตกแต่ง */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: #dff7fb;
        }

        .circle.one {
            width: 230px;
            height: 230px;
            top: -100px;
            left: -80px;
        }

        .circle.two {
            width: 180px;
            height: 180px;
            right: -70px;
            bottom: -70px;
            background: #e9e5fa;
        }

        /* เส้นวงจร */
        .circuit {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 2px solid #b8eaf2;
            border-radius: 15px;
            opacity: 0.6;
        }

        .circuit::before,
        .circuit::after {
            content: "";
            position: absolute;
            background: #b8eaf2;
        }

        .circuit::before {
            width: 40px;
            height: 2px;
            top: 35px;
            left: -20px;
        }

        .circuit::after {
            width: 2px;
            height: 40px;
            right: 30px;
            bottom: -20px;
        }

        .circuit.left {
            left: 40px;
            top: 150px;
            transform: rotate(-10deg);
        }

        .circuit.right {
            right: 45px;
            bottom: 130px;
            transform: rotate(15deg);
        }

        /* เนื้อหา */
        .content {
            position: relative;
            z-index: 2;
            padding: 40px;
        }

        .gear {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #d9f5fa;
            border-radius: 20px;

            font-size: 38px;
            transform: rotate(-10deg);

            box-shadow: 0 10px 25px rgba(70, 190, 210, 0.15);
        }

        .subtitle {
            color: #36bfd3;
            font-size: 17px;
            letter-spacing: 5px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(45px, 7vw, 82px);
            color: #25364a;
            margin-bottom: 15px;
            font-weight: 800;
        }

        h1 span {
            color: #35c6dc;
        }

        .line {
            width: 75px;
            height: 5px;
            background: #36c6dc;
            border-radius: 10px;
            margin: 0 auto 25px;
        }

        .description {
            color: #7a8998;
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* ป้ายด้านล่าง */
        .tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 9px 17px;
            border-radius: 50px;
            background: #f0f9fb;
            color: #45aabd;
            font-size: 13px;
            border: 1px solid #d8f1f5;
        }

        /* Responsive */
        @media (max-width: 600px) {

            .hero {
                min-height: 520px;
                border-radius: 25px;
            }

            .content {
                padding: 25px;
            }

            .subtitle {
                font-size: 12px;
                letter-spacing: 3px;
            }

            h1 {
                font-size: 42px;
            }

            .description {
                font-size: 12px;
                letter-spacing: 1px;
            }

            .circuit {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main class="hero">

        <!-- ตกแต่งพื้นหลัง -->
        <div class="circle one"></div>
        <div class="circle two"></div>

        <div class="circuit left"></div>
        <div class="circuit right"></div>

        <!-- เนื้อหาหลัก -->
        <section class="content">

            <div class="gear">⚙</div>

            <div class="subtitle">
                MECHATRONICS ENGINEERING
            </div>

            <h1>
                นารีลักษณ์ <span>ยะวรรณ์</span>
            </h1>

            <div class="line"></div>

            <p class="description">
                MECHANICAL • ELECTRONICS • CONTROL • AUTOMATION
            </p>

            <div class="tags">
                <div class="tag">⚙ Mechanical</div>
                <div class="tag">⚡ Electronics</div>
                <div class="tag">⌁ Control</div>
                <div class="tag">◉ Automation</div>
            </div>

        </section>

    </main>

</body>
</html>
